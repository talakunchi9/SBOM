services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sbom
      POSTGRES_PASSWORD: "123456789"
      POSTGRES_DB: "S-BOM"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbom -d S-BOM"]
      interval: 5s
      timeout: 5s
      retries: 10
